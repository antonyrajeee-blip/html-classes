<!DOCTYPE html>
<html>
<head>
    <title>Lucky draw</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: navy;
        }

        input{
            padding: 8px;
            margin: 5px;
            border: 2px solid navy;
            border-radius: 6px;
            width: 220px;
        }

        button{
            background: navy;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Luck Draw</h1>
    <p>Enter your name and guess a number to win!</p>

    <input type = "text" id = "name" placeholder="your name" required>
    <br>
    <p id="msg-name"></p>

    <input type = "number"  id="guess" placeholder="Guess a number (1 to 5)" min="1" max="5" required><br>
    <p id = "msg-guess"></p>

    <button onclick="checkForm()">Try My Luck!</button>
    <p id = "result"></p>
    <p id = "timer"></p>

    <script>
        var seconds = 0;
        setInterval(function() {
            seconds = seconds + 1;
            document.getElementById("timer").textContent = "have been here for " + seconds + " seconds"
        }, 1000);

        function checkForm(){
            var name = document.getElementById("name").value;
            var guess = document.getElementById("guess").value;
            var ok = true;

            if (name == ""){
                document.getElementById("msg-name").textContent = "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").textContent = "Great name!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (guess == ""){
                document.getElementById("msg-guess").textContent = "Please enter a guess!";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;
            }else{
                document.getElementById("msg-guess").textContent = "Great guess!";
                document.getElementById("msg-guess").style.color = "green";
                }

            if (ok == true){
                var lucky = Math.floor(Math.random() * 5) + 1;
                if (guess == lucky){
                    document.getElementById("result").textContent = "you win!, " + name + "! The luck number was " + lucky + "!";
                    document.getElementById("result").style.color = "green";
                }else{
                    document.getElementById("result").textContent = "you lose!, " + name + "! The luck number was " + lucky + ". Try again!";
                    document.getElementById("result").style.color = "navy";
                }
            }
            }
    </script>
</body>
</html>
