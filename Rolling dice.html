<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                text-align: center;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #d3eaed;
            }

            .disc{
                font-size: 30px;
                color: #002126;
            }

            #dice{
                font-size: 320px;
            }

            #dice:hover{
                cursor: pointer;
            }

            h1{
                color: #002126;
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                font-size: 60px;
            }
        </style>
    </head>
    <body>
        <h1>Rolling Dice</h1>
        <div class = "disc">Click on the dice...</div>
        <div id = "dice" onclick="stopstart()"></div>
        <script>
            var dice;
            var dices = ['&#9856;', '&#9857;', '&#9858;', '&#9859;', '&#9860;', '&#9861;'];
            var stopped = true;
            var t;

            function change(){
                var random = Math.floor(Math.random() * 6);
                dice.innerHTML = dices[random];
            }

            function stopstart() {
                if (stopped) {
                    stopped = false;
                    t = setInterval(change, 100);
                } else {
                    clearInterval(t);
                    stopped = true;
                }   
            }

            window.onload = function(){
                dice = document.getElementById("dice");
                stopstart();
            }
        </script>
    </body>
</html>
