<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <section>
            <img class = "mySlides" src = "https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80" style="height:500px;">
            <img class = "mySlides" src = "https://static.vecteezy.com/vite/assets/photo-masthead-375-BoK_p8LG.webp" style="height:500px; width:500px;">
            <img class = "mySlides" src = "https://static.vecteezy.com/system/resources/thumbnails/057/068/323/small/single-fresh-red-strawberry-on-table-green-background-food-fruit-sweet-macro-juicy-plant-image-photo.jpg" style="height:500px;">
            <img class = "mySlides" src = "https://cdn.pixabay.com/photo/2022/10/22/17/00/gull-7539615_1280.jpg" style="height:500px; width:500px;">
        </section>
        <script>
            var myIndex = 0;
            carousel();

            function carousel(){
                var i;
                var x = document.getElementsByClassName("mySlides");
                for(i = 0; i < x.length; i++){
                    x[i].style.display = "none";
                }
                myIndex++;
                if (myIndex > x.length){myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000); 
            }
        </script>
    </body>
</html>
