<!DOCTYPE html>
<html>
<head>
    <title>Event Regestration Form</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: rgb(255, 240, 240);
            padding: 30px;
            text-align: center;
        }
        
        h1{
            color: rgb(128, 0, 0);
        }

        input{
            padding: 8px;
            margin: 5px;
            border: 2px rgb(128, 0, 0);
            border-radius: 6px;
            width: 220px;
        }

        button{
            background: rgb(128, 0, 0);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Event registration form</h1>
    <p>put in your information below to get a ticket to the event!</p>

    <input type = "text" id = "name" placeholder="your name" required>
    <br>
    <p id = "msg-name"></p>
    
    <input type = "email" id = "email" placeholder="your email" required>
    <br>
    <p id = "msg-email"></p>
    
    <input type = "hieght" id = "height" placeholder="your height" required>
    <br>
    <p id = "msg-height"></p>
    
    <input type = "weight" id = "weight" placeholder="your weight" required>
    <br>
    <p id = "msg-weight"></p>
    
    <input type = "number" id = "age" placeholder="your age(have to be 10 to 50)" min="10" max="50" required>
    <br>
    <p id = "msg-age"></p>
    <button onclick="signUp()">Submit</button>
    <p id="loading"></p>
    <p id="result"></p>

    <script>
        function signUp(){
            var name = document.getElementById("name").value
            var email = document.getElementById("email").value
            var height = document.getElementById("height").value
            var weight = document.getElementById("weight").value
            var age = document.getElementById("age").value
            var ok = true;

            if (name == ""){
                document.getElementById("msg-name").textContent = "Please enter your name!";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").textContent = "Great name!";
                document.getElementById("msg-name").style.color = "green";
            }

            if (email == ""){
                document.getElementById("msg-email").textContent = "Please enter your email!";
                document.getElementById("msg-email").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-email").textContent = "Email saved!";
                document.getElementById("msg-email").style.color = "green";
            }

            if (height == ""){
                document.getElementById("msg-height").textContent  = "please enter your height!";
                document.getElementById("msg-height").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-height").textContent = "Great!";
                document.getElementById("msg-height").style.color = "green";
            }   

            if (weight == ""){
                document.getElementById("msg-weight").textContent  = "please enter your weight!";
                document.getElementById("msg-weight").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-weight").textContent = "The perfect wieght!";
                document.getElementById("msg-weight").style.color = "green";
            }

            if (age == ""){
                document.getElementById("msg-age").textContent  = "please enter your age!";
                document.getElementById("msg-age").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-age").textContent = "You are eligible to attend!";
                document.getElementById("msg-age").style.color = "green";
            }

            if (ok == true){
                document.getElementById("loading").textContent = "Loading...";
                setTimeout(function() {
                    document.getElementById("loading").textContent = "";
                    document.getElementById("result").textContent = "Thank you for signing up, " + name + "! You will receive an email at " + email + " with your ticket.";
                    document.getElementById("result").style.color = "green";
                }, 5000);
            }
        }
    </script>
</body>
</html>
